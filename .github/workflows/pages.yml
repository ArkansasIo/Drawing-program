name: Deploy Anime Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'src/**'
      - 'assets/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static modules
        run: |
          test -f index.html
          test -f app.js
          test -f src/generator.js
          test -f src/stage3d.js
          test -f src/studio-init.js
          test -f src/lipsync.js
          test -f src/animation.js
          test -f src/assets.js
          test -f src/storyboard.js
          test -f src/rigging.js
          test -f src/camera.js
          test -f src/project.js
          test -f src/tools.js
          test -f src/render.js
          test -f src/studio-runtime.js
          test -f src/selection.js
          test -f src/keyframes.js
          test -f src/audio.js
          test -f src/importer.js
          test -f src/validation.js
          test -f src/stage-state.js
          test -f src/undo.js
          test -f src/serialization.js
          test -f src/cel.js
          test -f src/brushes.js
          test -f src/rig-solver.js
          test -f src/waveform.js
          test -f src/export.js
      - name: Upload Anime Studio
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
